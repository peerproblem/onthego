name: ci

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.2"

jobs:
  check:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: make check
      - run: go test -race ./...
      - run: make build
      - run: ./scripts/demo.sh
      - run: python3 scripts/sigint-e2e.py
      - run: python3 scripts/npm-signal-e2e.py
      - run: python3 scripts/benchmark.py --profile smoke --output benchmark.json
      - name: Install tested native agent versions
        run: npm install --prefix "$RUNNER_TEMP/agent-clis" @openai/codex@0.163.0 @anthropic-ai/claude-code@2.1.301 --no-audit --no-fund
      - name: Verify native agent resume without copied authentication or databases
        run: python3 scripts/agent-compatibility/verify.py --codex "$RUNNER_TEMP/agent-clis/node_modules/.bin/codex" --claude "$RUNNER_TEMP/agent-clis/node_modules/.bin/claude"
      - run: make package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmark.json

  ssh-e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: make build
      - run: ./scripts/ssh-e2e.sh

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check reachable vulnerabilities and report module findings
        run: govulncheck -show verbose ./...
