<!doctype html>
<!-- Source for onthego-banner.png. Render with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=2 --window-size=1600,600 --screenshot=assets/onthego-banner.png assets/banner.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1600px; height: 600px; overflow: hidden; background: #fff; }
  body { position: relative; color: #0b0b0c; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .logo { position: absolute; left: 80px; top: 64px; font-weight: 700; font-size: 34px; letter-spacing: -.05em; display: flex; align-items: center; gap: 10px; }
  .logo i { width: 18px; height: 18px; border-radius: 50%; background: #d6ff3c; border: 3px solid #0b0b0c; display: inline-block; }
  h1 { position: absolute; left: 76px; top: 140px; margin: 0; font-weight: 700; font-size: 136px; line-height: .9; letter-spacing: -.065em; width: 860px; }
  h1 span { color: #2a55ff; }
  .term { position: absolute; right: 80px; top: 92px; width: 560px; border: 3px solid #0b0b0c; border-radius: 22px; background: #0b0b0c; box-shadow: 9px 9px 0 #0b0b0c; overflow: hidden; }
  .bar { background: #fff; border-bottom: 3px solid #0b0b0c; padding: 14px 18px; display: flex; gap: 9px; align-items: center; font-weight: 700; font-size: 16px; }
  .bar i { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid #0b0b0c; display: inline-block; }
  .bar i:nth-child(1) { background: #ff6a2b; } .bar i:nth-child(2) { background: #d6ff3c; } .bar i:nth-child(3) { background: #b9e6ff; }
  .bar span { margin-left: 8px; }
  .body { padding: 20px 24px 26px; font: 500 18px/1.75 "JetBrains Mono", monospace; color: #f4f4f2; }
  .c::before { content: "$ "; color: #8b8b93; }
  .dim { color: #8b8b93; } .ok { color: #d6ff3c; } .bl { color: #9fb4ff; }
  .pill { display: inline-block; font: 700 14px/1 "Helvetica Neue", Helvetica, Arial; padding: 6px 10px; border-radius: 999px; background: #d6ff3c; color: #0b0b0c; margin: 4px 6px 0 0; }
  .pill.s { background: #b9e6ff; } .pill.o { background: #ff6a2b; }
  .stk { position: absolute; border: 3px solid #0b0b0c; box-shadow: 5px 5px 0 #0b0b0c; font-weight: 700; letter-spacing: -.03em; }
  .circle { width: 140px; height: 140px; border-radius: 50%; background: #ffb3e1; left: 880px; top: 360px; display: grid; place-items: center; font-size: 34px; transform: rotate(-12deg); }
  .p1 { right: 330px; bottom: 74px; background: #d6ff3c; border-radius: 999px; padding: 12px 20px; font-size: 24px; transform: rotate(-5deg); }
  .p2 { right: 96px; bottom: 96px; background: #ff6a2b; border-radius: 999px; padding: 12px 20px; font-size: 24px; transform: rotate(4deg); }
</style>
</head>
<body>
  <div class="logo">onthego<i></i></div>
  <h1>Your work goes <span>where you go.</span></h1>
    <div class="term">
    <div class="bar"><i></i><i></i><i></i><span>desktop: ~/projects/shop</span></div>
    <div class="body">
      <div class="c">onthego sync laptop</div>
      <div class="dim">Sync: push (this device has new work)</div>
      <div><span class="ok">Sent to laptop</span> → ~/projects/shop</div>
      <div><span class="pill">staged ✓</span><span class="pill s">unstaged ✓</span><span class="pill">untracked ✓</span><span class="pill o">codex session ✓</span></div>
      <div class="bl">Resume: codex resume 0199a88c</div>
    </div>
  </div>
  <div class="stk circle">1 cmd</div>
  <div class="stk p1">no account</div>
  <div class="stk p2">no server</div>
</body>
</html>
